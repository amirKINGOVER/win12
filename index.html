<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Win 12 — محاكي</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:rgba(243,243,243,.86);--bg2:rgba(255,255,255,.55);--tx:#1b1b1b;--mu:#5f5f5f;--ac:#0067c0;--ln:rgba(0,0,0,.12);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:rgba(32,32,32,.86);--bg2:rgba(255,255,255,.07);--tx:#fff;--mu:#aaa;--ac:#60cdff;--ln:rgba(255,255,255,.14);color-scheme:dark}}
:root[data-theme="dark"]{--bg:rgba(32,32,32,.86);--bg2:rgba(255,255,255,.07);--tx:#fff;--mu:#aaa;--ac:#60cdff;--ln:rgba(255,255,255,.14);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{position:relative;color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Tahoma,Arial,sans-serif;user-select:none;touch-action:manipulation;background:var(--wp,radial-gradient(circle at 25% 75%,#4cc2ff,transparent 50%),radial-gradient(circle at 75% 25%,#8b7bff,transparent 50%),linear-gradient(135deg,#0b2a5b,#1d1b4d))}
.glass{background:var(--bg);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--ln)}
#desk{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;max-height:calc(100% - 70px);gap:6px;direction:ltr}
.di{width:78px;padding:6px 2px;text-align:center;color:#fff;font-size:12px;border-radius:6px;text-shadow:0 1px 3px #0009;cursor:pointer}
.di:hover{background:#fff3}.di span{font-size:34px;display:block}
.win{position:absolute;border-radius:10px;box-shadow:0 12px 40px #0006;display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.tb{direction:ltr;display:flex;align-items:center;height:36px;padding-left:10px;gap:8px;touch-action:none;font-size:13px}
.tb b{flex:1;font-weight:400}
.tb button{width:44px;height:36px;border:0;background:transparent;color:var(--tx);font-size:13px;cursor:pointer}
.tb button:hover{background:var(--bg2)}.tb .x:hover{background:#c42b1c;color:#fff}
.bd{flex:1;overflow:auto;display:flex;flex-direction:column;background:var(--bg2)}
.row{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}.row:hover,.row.sel{background:var(--bg2)}
textarea.note{flex:1;border:0;padding:12px;background:transparent;color:var(--tx);font:15px/1.7 inherit;resize:none;outline:0}
.calc{padding:10px;gap:8px}
.calc input{width:100%;padding:10px;font-size:24px;text-align:left;direction:ltr;border:0;border-radius:8px;background:var(--bg2);color:var(--tx)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;direction:ltr;flex:1}
.keys button{border:0;border-radius:6px;background:var(--bg2);color:var(--tx);font-size:18px;cursor:pointer}
.keys button:hover{filter:brightness(1.2)}.keys .op{background:var(--ac);color:#fff}
.term{background:rgba(12,12,12,.92);color:#ddd;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:8px;direction:ltr;text-align:left;user-select:text}
.term .l{white-space:pre-wrap}.term .r{display:flex;gap:6px}.term input{flex:1;background:transparent;border:0;outline:0;color:inherit;font:inherit}
.seg{display:flex;gap:6px}.seg button,.tile{border:1px solid var(--ln);border-radius:8px;background:var(--bg2);color:var(--tx);cursor:pointer;padding:8px}
.seg button{flex:1}.wps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.wps div{height:60px;border-radius:8px;cursor:pointer;border:2px solid var(--ln)}
#tb{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;direction:ltr;padding:0 8px;z-index:9000;border-width:1px 0 0}
#tb .c{display:flex;gap:2px;align-items:center}
.tbi{width:42px;height:42px;border:0;border-radius:6px;background:transparent;font-size:21px;cursor:pointer;position:relative;color:var(--tx)}
.tbi:hover{background:var(--bg2)}.tbi.run::after{content:"";position:absolute;bottom:2px;left:50%;width:6px;height:3px;margin-left:-3px;border-radius:2px;background:#999}
.tbi.on::after{width:14px;margin-left:-7px;background:var(--ac)}
.logo{display:grid;grid-template-columns:repeat(2,9px);gap:2px;justify-content:center}.logo i{width:9px;height:9px;background:var(--ac);border-radius:1px}
.chip{justify-self:start;font-size:12px;padding:4px 8px;border-radius:6px;display:flex;gap:6px;align-items:center}
.tray{justify-self:end;display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 8px;border-radius:6px;cursor:pointer;text-align:right}
.tray:hover,.chip:hover{background:var(--bg2)}
#sm,#qs{position:fixed;display:none;z-index:9001;border-radius:12px;padding:14px;box-shadow:0 12px 40px #0006;bottom:calc(60px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 100px);overflow:auto}
#sm{left:50%;width:min(540px,calc(100vw - 16px));transform:translateX(-50%)}
#qs{right:8px;width:min(330px,calc(100vw - 16px))}
#sm.show{display:block;animation:up .18s}#qs.show{display:block;animation:up2 .18s}
@keyframes up{from{opacity:0;transform:translate(-50%,16px)}}@keyframes up2{from{opacity:0;transform:translateY(16px)}}
#sq{width:100%;padding:10px 14px;border:0;border-bottom:2px solid var(--ac);border-radius:20px;background:var(--bg2);color:var(--tx);font-size:14px;margin-bottom:12px}
.h{font-size:13px;font-weight:600;margin:10px 4px 6px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pi{border:0;background:transparent;color:var(--tx);border-radius:8px;padding:10px 2px;font-size:12px;cursor:pointer}.pi:hover{background:var(--bg2)}.pi span{display:block;font-size:28px}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:10px 6px 0;border-top:1px solid var(--ln);font-size:13px}
.ft button{border:0;background:transparent;color:var(--tx);font-size:18px;cursor:pointer;border-radius:6px;padding:4px 8px}.ft button:hover{background:var(--bg2)}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tile{font-size:12px;padding:12px 4px;text-align:center}.tile.on{background:var(--ac);color:#fff}
@media(max-width:600px){.chip,.tray>span:first-child{display:none}#tb{grid-template-columns:1fr auto}#tbc{min-width:0;overflow-x:auto;justify-content:flex-start}}
@keyframes spin{to{transform:rotate(360deg)}}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99998}
#off{position:fixed;inset:0;background:#000;color:#888;display:none;align-items:center;justify-content:center;z-index:99999;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div id="desk"></div>
<div id="sm" class="glass"><input id="sq" placeholder="ابحث عن تطبيق…"><div class="h">المثبّتة</div><div class="pg" id="pg"></div><div class="h">الموصى بها</div><div id="rc"></div><div class="ft"><span>👤 المستخدم</span><button id="pw" title="إيقاف التشغيل">⏻</button></div></div>
<div id="qs" class="glass"><div class="tg"><div class="tile on" id="qt">🌙<br>الوضع</div><div class="tile on">📶<br>الشبكة</div><div class="tile">✈️<br>الطيران</div></div>☀️ السطوع<input id="br" type="range" min="30" max="100" value="100" style="width:100%"><div class="h" id="qd"></div></div>
<div id="tb" class="glass"><div class="chip" title="بيانات وهمية">☀️ 24° مشمس</div><div class="c" id="tbc"><button class="tbi" id="sb"><div class="logo"><i></i><i></i><i></i><i></i></div></button><button class="tbi" id="sr">🔍</button></div><div class="tray" id="tray"><span>🌐 🔊 🔋</span><span><div id="tm"></div><div id="dt"></div></span></div></div>
<div id="dim"></div><div id="off">تم إيقاف التشغيل — اضغط للتشغيل</div>
<script>
const $=id=>document.getElementById(id);
const DEF={"المستندات":{"readme.txt":"مرحباً بك في محاكي Win 12!\nافتح التطبيقات من شريط المهام أو قائمة ابدأ.","todo.txt":"1. جرّب الآلة الحاسبة\n2. افتح الطرفية\n3. غيّر الخلفية من الإعدادات"},"التنزيلات":{"setup.txt":"ملف تثبيت وهمي."},"سطح المكتب":{"ملاحظات.txt":"اكتب هنا أفكارك…"}};
let FS=null,TR=null,GAL=[];try{FS=JSON.parse(localStorage.getItem("fs"));TR=JSON.parse(localStorage.getItem("tr"));GAL=JSON.parse(localStorage.getItem("gal"))||[]}catch(_){}
FS=FS||DEF;TR=TR||{};
const save=()=>{try{localStorage.setItem("fs",JSON.stringify(FS));localStorage.setItem("tr",JSON.stringify(TR))}catch(_){}};
const saveG=()=>{try{localStorage.setItem("gal",JSON.stringify(GAL))}catch(_){}};
const WP=[["نسيم","radial-gradient(circle at 25% 75%,#4cc2ff,transparent 50%),radial-gradient(circle at 75% 25%,#8b7bff,transparent 50%),linear-gradient(135deg,#0b2a5b,#1d1b4d)"],["غروب","radial-gradient(circle at 70% 80%,#ff9a5a,transparent 50%),radial-gradient(circle at 20% 20%,#ff5fa2,transparent 50%),linear-gradient(135deg,#3b1d5e,#7a2a4d)"],["غابة","radial-gradient(circle at 30% 70%,#5fe3a1,transparent 50%),radial-gradient(circle at 80% 20%,#2db3c7,transparent 50%),linear-gradient(135deg,#0c3b36,#0f2d4a)"],["فاتح","radial-gradient(circle at 25% 75%,#9fd8ff,transparent 55%),radial-gradient(circle at 75% 25%,#d2c4ff,transparent 55%),linear-gradient(135deg,#e6f1ff,#f3eaff)"]];

const R=document.documentElement;
const isDark=()=>R.dataset.theme?R.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
function setTheme(m){m==="auto"?R.removeAttribute("data-theme"):R.dataset.theme=m;$("qt").classList.toggle("on",isDark())}
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const APPS={
files:{t:"مستكشف الملفات",i:"📁",w:520,h:340,build(b){
  b.style.flexDirection="row";const sb=mk("div"),ct=mk("div");
  sb.style.cssText="width:130px;border-left:1px solid var(--ln);padding:8px";ct.style.cssText="flex:1;padding:8px;overflow:auto";
  const show=f=>{ct.innerHTML="";Object.keys(FS[f]).forEach(n=>{const d=mk("div","row","📄 "+n);d.onclick=()=>openApp("notes",{n,t:FS[f][n]});ct.appendChild(d)});[...sb.children].forEach(x=>x.classList.toggle("sel",x.dataset.f===f))};
  Object.keys(FS).forEach(f=>{const d=mk("div","row","📂 "+f);d.dataset.f=f;d.onclick=()=>show(f);sb.appendChild(d)});
  b.append(sb,ct);show("المستندات")}},
notes:{t:"المفكرة",i:"📝",w:360,h:280,build(b,w){w.ta=mk("textarea","note");w.ta.placeholder="اكتب هنا…";b.appendChild(w.ta)},arg(w,a){w.ta.value=a.t;w.el.querySelector(".tb b").textContent=a.n+" — المفكرة"}},
calc:{t:"الآلة الحاسبة",i:"🧮",w:270,h:370,build(b){
  b.classList.add("calc");const d=mk("input");d.readOnly=true;d.placeholder="0";const g=mk("div","keys");
  "C ( ) ÷ 7 8 9 × 4 5 6 − 1 2 3 + 0 . ⌫ =".split(" ").forEach(k=>{const x=mk("button","",k);if("÷×−+=".includes(k))x.className="op";
    x.onclick=()=>{if(k==="C")d.value="";else if(k==="⌫")d.value=d.value.slice(0,-1);else if(k==="="){try{const e=d.value.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-");if(!/^[0-9+\-*/.() ]+$/.test(e))throw 0;const r=Function('"use strict";return ('+e+')')();d.value=Number.isFinite(r)?String(+r.toFixed(10)):"خطأ"}catch(_){d.value="خطأ"}}else d.value+=k};g.appendChild(x)});
  b.append(d,g)}},
term:{t:"الطرفية",i:"💻",w:400,h:300,build(b){
  b.classList.add("term");const log=mk("div","l","Win 12 Terminal\nاكتب help لعرض الأوامر\n"),r=mk("div","r"),i=mk("input");r.append(mk("span","","$"),i);b.append(log,r);i.autocapitalize="off";i.autocomplete="off";
  const out=s=>{log.textContent+=s+"\n"},all=Object.assign({},...Object.values(FS));
  i.onkeydown=e=>{if(e.key!=="Enter")return;const v=i.value.trim();i.value="";out("$ "+v);const[c,...a]=v.split(/\s+/);
    if(c==="help")out("help ls cat <file> echo <text> date whoami theme <light|dark> open <files|notes|calc|term|settings> clear");
    else if(c==="ls")out(Object.keys(all).join("  "));else if(c==="cat")out(all[a.join(" ")]??"الملف غير موجود");
    else if(c==="echo")out(a.join(" "));else if(c==="date")out(new Date().toString());else if(c==="whoami")out("user");
    else if(c==="theme")setTheme(a[0]==="light"?"light":"dark");else if(c==="open")APPS[a[0]]?openApp(a[0]):out("تطبيق غير معروف");
    else if(c==="crash")bsod("CRITICAL_PROCESS_DIED");else if(c==="clear")log.textContent="";else if(c)out(c+": أمر غير معروف");b.scrollTop=b.scrollHeight}}},
settings:{t:"الإعدادات",i:"⚙️",w:440,h:330,build(b){
  b.style.cssText+="padding:14px;gap:12px";
  b.innerHTML='<div>المظهر</div><div class="seg"><button data-m="light">☀️ فاتح</button><button data-m="dark">🌙 داكن</button><button data-m="auto">🖥️ تلقائي</button></div><div>خلفية سطح المكتب</div><div class="wps"></div>';
  b.querySelectorAll("[data-m]").forEach(x=>x.onclick=()=>setTheme(x.dataset.m));
  const g=b.querySelector(".wps");WP.forEach((p,i)=>{const d=mk("div");d.style.background=p[1];d.title=p[0];d.onclick=()=>setWP(i);g.appendChild(d)})}}
};
APPS.files={t:"مستكشف الملفات",i:"📁",w:520,h:340,build(b,w){
 b.style.flexDirection="row";const sb=mk("div"),ct=mk("div");
 sb.style.cssText="width:130px;border-left:1px solid var(--ln);padding:8px";ct.style.cssText="flex:1;padding:8px;overflow:auto";let cur="المستندات";
 w.render=()=>{sb.innerHTML=ct.innerHTML="";
  [...Object.keys(FS),"🗑️"].forEach(f=>{const d=mk("div","row"+(f===cur?" sel":""),f==="🗑️"?"🗑️ المحذوفات":"📂 "+f);d.onclick=()=>{cur=f;w.render()};sb.appendChild(d)});
  const tr=cur==="🗑️",src=tr?TR:FS[cur];
  if(tr&&Object.keys(TR).length){const e=mk("button","tile","إفراغ السلة");e.onclick=()=>{TR={};save();w.render()};ct.appendChild(e)}
  Object.keys(src).forEach(n=>{const r=mk("div","row");r.style.cssText="display:flex;justify-content:space-between";r.appendChild(mk("span","","📄 "+n));
   const x=mk("span","",tr?"↩":"✕");x.style.padding="0 8px";
   x.onclick=e=>{e.stopPropagation();if(tr){const f=FS[src[n].f]?src[n].f:"المستندات";FS[f][n]=src[n].t;delete TR[n]}else{TR[n]={t:src[n],f:cur};delete FS[cur][n]}save();w.render()};
   r.onclick=()=>openApp("notes",{n,t:tr?src[n].t:src[n],f:cur});r.appendChild(x);ct.appendChild(r)});
  if(!Object.keys(src).length)ct.appendChild(mk("div","h","لا توجد ملفات"))};
 b.append(sb,ct);w.render()}};
APPS.notes={t:"المفكرة",i:"📝",w:380,h:300,build(b,w){
 const bar=mk("div");bar.style.cssText="display:flex;gap:6px;padding:6px";
 w.nm=mk("input");w.nm.placeholder="اسم الملف.txt";w.nm.style.cssText="flex:1;min-width:0;padding:6px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg2);color:var(--tx)";
 const sv=mk("button","tile","💾 حفظ");sv.style.padding="6px 10px";w.f="المستندات";
 sv.onclick=()=>{const n=w.nm.value.trim();if(!n)return;FS[w.f]=FS[w.f]||{};FS[w.f][n]=w.ta.value;save();sv.textContent="✔ تم";setTimeout(()=>sv.textContent="💾 حفظ",1200);wins.files&&wins.files.render&&wins.files.render()};
 const dl=mk("button","tile","⬇️");dl.title="تنزيل على جهازك";dl.style.padding="6px 10px";
 dl.onclick=async()=>{try{const d=await claude.use("downloads");if(!d){dl.textContent="✖";return}let n=w.nm.value.trim()||"ملف.txt";if(!/\.txt$/.test(n))n+=".txt";await d.save({filename:n,data:w.ta.value||" "})}catch(e){}};
 bar.append(w.nm,sv,dl);w.ta=mk("textarea","note");w.ta.placeholder="اكتب هنا…";b.append(bar,w.ta)},
 arg(w,a){w.ta.value=a.t;w.nm.value=a.n;w.f=FS[a.f]?a.f:"المستندات";w.el.querySelector(".tb b").textContent=a.n+" — المفكرة"}};
function snake(a,w){
 const c=mk("canvas");c.width=c.height=240;c.style.cssText="background:var(--bg2);border-radius:8px";const sc=mk("div","h","النقاط: 0"),pad=mk("div","seg");a.append(sc,c,pad);
 const x=c.getContext("2d");let s=[[5,5]],d=[1,0],f=[8,8],n=0,dead=false;
 const dir=(p,q)=>{if(p!==-d[0]||q!==-d[1])d=[p,q]};
 [["⬅️",-1,0],["⬆️",0,-1],["⬇️",0,1],["➡️",1,0]].forEach(k=>{const t=mk("button","",k[0]);t.onclick=()=>dir(k[1],k[2]);pad.appendChild(t)});
 const rs=mk("button","","⟳");rs.onclick=()=>{clearInterval(w.iv);a.innerHTML="";snake(a,w)};pad.appendChild(rs);
 document.onkeydown=e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(m&&c.isConnected){e.preventDefault();dir(...m)}};
 w.iv=setInterval(()=>{if(!c.isConnected){clearInterval(w.iv);return}if(dead)return;
  const h=[s[0][0]+d[0],s[0][1]+d[1]];
  if(h[0]<0||h[1]<0||h[0]>11||h[1]>11||s.some(p=>p[0]===h[0]&&p[1]===h[1])){dead=true;sc.textContent="خسرت! النقاط: "+n+" — اضغط ⟳";return}
  s.unshift(h);if(h[0]===f[0]&&h[1]===f[1]){n++;sc.textContent="النقاط: "+n;f=[Math.random()*12|0,Math.random()*12|0]}else s.pop();
  x.clearRect(0,0,240,240);x.fillStyle="#e5484d";x.fillRect(f[0]*20+2,f[1]*20+2,16,16);x.fillStyle="#2ea44f";s.forEach(p=>x.fillRect(p[0]*20+1,p[1]*20+1,18,18))},150)}
function memory(a){
 const E="🍎🍋🍇🍓🥝🍒🍉🍍".match(/./gu),cards=[...E,...E].sort(()=>Math.random()-.5);let open=[],done=0,mv=0;
 const sc=mk("div","h","الحركات: 0"),g=mk("div");g.style.cssText="display:grid;grid-template-columns:repeat(4,56px);gap:6px;direction:ltr";
 cards.forEach(v=>{const k=mk("button","tile","");k.style.cssText="height:56px;font-size:26px";

 a.append(sc,g)}
APPS.games={t:"الألعاب",i:"🎮",w:300,h:410,build(b,w){
 b.style.cssText+="padding:8px;gap:8px;align-items:center";const tabs=mk("div","seg"),area=mk("div");area.style.cssText="display:flex;flex-direction:column;align-items:center;gap:8px;width:100%";
 ["🐍 ثعبان","🧠 ذاكرة"].forEach((t,i)=>{const k=mk("button","",t);k.onclick=()=>{clearInterval(w.iv);area.innerHTML="";[snake,memory][i](area,w)};tabs.appendChild(k)});
 b.append(tabs,area);tabs.firstChild.click()}};
APPS.paint={t:"الرسام",i:"🎨",w:360,h:430,build(b,w){
 b.style.cssText+="padding:8px;gap:8px";const bar=mk("div");bar.style.cssText="display:flex;gap:6px;align-items:center";
 const col=mk("input");col.type="color";col.value="#0067c0";const sz=mk("input");sz.type="range";sz.min=1;sz.max=30;sz.value=4;sz.style.flex="1";
